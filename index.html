<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Flip Card</title>
        <link rel="stylesheet" href="anjo_flipkard.css"/>
    </head>
    
    <body>

        <div class="ig-card-scene" id="flipCard" role="button" tabindex="0" aria-label="Flip Instagram Card">
            <div class="ig-card" id="igCard">

                <!-- Front Side -->
                <div class="ig-card-face ig-card-front">
                    <span class="badge">Hi there!👋</span>
                        <div class="card-main">
                                    <div class="card-img-box">
                                    <img src="Instagramable.jpg" alt="Sample design preview" class="card-img-box"/>

                                    <img src="Instagramable.jpg" alt="Sample design preview" class="card-img"/>
                                    </div>
                        </div>

                        <div class="card-footer">
                            <span>@your_are_loved</span>
                            <span class="flip-hint">Tap to flip ↻</span>
                        </div>
                </div>

                <!-- Back Side -->
                <div class="ig-card-face ig-card-back">
                    <span class="badge">God's message for you.</span>
                    <div class="card-main">
                        <h1>Romans 8:28</h1>
                        <p>And we know that in all things God works for the good of those who love him, who have been called according to his purpose.</p>
                    </div>

                    <div class="card-footer">
                        <a href="https://www.youtube.com/watch?v=IoezWBPGRAc&list=RDIoezWBPGRAc&start" target="_blank" rel="audio/mp4" class="Tap">Tap again</a>
                        <span class="flip-hint">↺ Flip back</span>
                    </div>
                </div>

            </div>
        </div>

        <script src="anjo_flipkard.js"></script>

    </body>
</html>
